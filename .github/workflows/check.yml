name: Check the site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails the run on a broken link, missing image, duplicate id,
      # unlabelled form field or unbalanced tag.
      - name: Check pages, links and images
        run: python3 tools/check_site.py .

      # Fails the run if the price rules, saved data, availability, cancellation
      # rules or calendar file break, or if the Prices page drifts from data.js.
      - name: Test the booking logic
        run: node tools/test_logic.js
